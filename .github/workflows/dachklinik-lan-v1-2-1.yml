# DACHKLINIK REMOTE V1.2.1 AUTOMATIC LAN AND APPROVAL, Windows x64 portable pilot.
# Install alongside the V1.1 workflow on the default branch and run manually.
# No push trigger, installer build, code signing, release, or deployment.
name: DACHKLINIK REMOTE V1.2.1 - AUTOMATIC LAN AND CLICK APPROVAL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dachklinik-rustdesk-x64-lan-v121
  cancel-in-progress: false

jobs:
  bridge:
    name: Generate Flutter-Rust bridge (required for Windows)
    runs-on: ubuntu-22.04
    env:
      RUST_VERSION: '1.75'
      CARGO_EXPAND_VERSION: '1.0.95'
      FLUTTER_RUST_BRIDGE_VERSION: '1.80.1'
    steps:
      - name: Check out DACHKLINIK DESIGN V1.0 with submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: dachklinik-v1.5.3
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false

      - name: Verify DACHKLINIK design revision
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          [[ "$revision" == 9a24afc* ]] || { echo "Unexpected revision: $revision"; exit 1; }
          test "$(git rev-parse HEAD^)" = '95cca3f661f635b3cc85c04935fe8d96d8f432ef' || { echo 'Base commit mismatch'; exit 1; }
          test "$(git diff --name-only HEAD^ HEAD)" = 'flutter/lib/desktop/pages/desktop_home_page.dart' || { echo 'Unexpected changed files'; exit 1; }
          python3 - <<'PY_CHECK_UI'
          from pathlib import Path
          s = Path('flutter/lib/desktop/pages/desktop_home_page.dart').read_text(encoding='utf-8')
          start = s.index('final children = <Widget>[')
          end = s.index('if (isIncomingOnly) {', start)
          ui = s[start:end]
          assert "'DACHKLINIK REMOTE'" in ui
          assert 'buildIDBoard(context)' in ui
          assert 'buildPasswordBoard(context)' not in ui
          assert 'buildHelpCards(' not in ui
          print('DESIGN V1.0 checked: only home UI modified; password authentication remains in core.')
          PY_CHECK_UI

      - name: Stage the versioned LAN discovery module
        shell: bash
        run: |
          cat > _DACHKLINIK_DISCOVERY_INPUT.rs <<'DACHKLINIK_DISCOVERY_RS'
          // Local discovery for DACHKLINIK REMOTE. No external dependencies in this module.
          use std::{
              collections::{BTreeMap, BTreeSet},
              io::{self, ErrorKind},
              net::{Ipv4Addr, SocketAddr, SocketAddrV4, UdpSocket},
              sync::atomic::{AtomicBool, Ordering},
              thread,
              time::{Duration, Instant},
          };

          pub const SESSION_PORT: u16 = 21138;
          const DISCOVERY_PORT: u16 = 21139;
          const QUERY: &[u8] = b"DACHKLINIK-V12-DISCOVER\0";
          const REPLY: &[u8] = b"DACHKLINIK-V12-HOST\0";
          const NAME_MAX: usize = 96;
          const MAX_PEERS: usize = 64;
          const SCAN_TIME: Duration = Duration::from_millis(700);
          static ACCEPTING: AtomicBool = AtomicBool::new(false);

          pub fn set_accepting(value: bool) {
              ACCEPTING.store(value, Ordering::Relaxed);
          }

          #[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord)]
          pub struct Network {
              local: Ipv4Addr,
              mask: u32,
          }

          impl Network {
              pub fn new(local: Ipv4Addr, netmask: Ipv4Addr) -> Option<Self> {
                  let mask = u32::from(netmask);
                  let prefix = mask.leading_ones();
                  if !local.is_private() || prefix == 0 || prefix > 30 || mask != u32::MAX << (32 - prefix) {
                      return None;
                  }
                  Some(Self { local, mask })
              }

              fn broadcast(self) -> Ipv4Addr {
                  Ipv4Addr::from(u32::from(self.local) | !self.mask)
              }

              fn admits(self, ip: Ipv4Addr) -> bool {
                  let address = u32::from(ip);
                  let network = u32::from(self.local) & self.mask;
                  ip.is_private()
                      && address & self.mask == network
                      && address != network
                      && ip != self.broadcast()
              }
          }

          pub fn other_lan_pc(networks: &[Network], ip: Ipv4Addr) -> bool {
              !networks.iter().any(|net| net.local == ip) && networks.iter().any(|net| net.admits(ip))
          }

          fn named_packet(nonce: &[u8], name: &str) -> Vec<u8> {
              let end = name
                  .char_indices()
                  .map(|(i, ch)| i + ch.len_utf8())
                  .take_while(|&i| i <= NAME_MAX)
                  .last()
                  .unwrap_or(0);
              let mut data = REPLY.to_vec();
              data.extend_from_slice(nonce);
              data.extend_from_slice(&name.as_bytes()[..end]);
              data
          }

          fn extract_name(packet: &[u8], nonce: &[u8; 16]) -> Option<String> {
              let body = packet.strip_prefix(REPLY)?.strip_prefix(nonce.as_slice())?;
              if body.is_empty() || body.len() > NAME_MAX {
                  return None;
              }
              let name = std::str::from_utf8(body).ok()?.trim();
              if name.is_empty() || name.chars().any(|c| c.is_control() || matches!(c, '\u{202a}'..='\u{202e}' | '\u{2066}'..='\u{2069}')) {
                  return None;
              }
              Some(name.to_owned())
          }

          pub fn listen(hostname: &str, networks: impl Fn() -> Vec<Network>, stopped: impl Fn() -> bool) -> io::Result<()> {
              let socket = UdpSocket::bind((Ipv4Addr::UNSPECIFIED, DISCOVERY_PORT))?;
              let mut buf = [0u8; 256];
              // Cache interface enumeration and the last reply time to bound work on bursts.
              let mut interfaces = Vec::new();
              let mut refreshed: Option<Instant> = None;
              let mut last_reply: Option<Instant> = None;
              loop {
                  let (size, source) = socket.recv_from(&mut buf)?;
                  let SocketAddr::V4(source) = source else { continue };
                  let Some(nonce) = buf[..size].strip_prefix(QUERY) else { continue };
                  if nonce.len() != 16 || !ACCEPTING.load(Ordering::Relaxed) || stopped() {
                      continue;
                  }
                  if last_reply.is_some_and(|t| t.elapsed() < Duration::from_millis(12)) {
                      continue;
                  }
                  if refreshed.map_or(true, |t| t.elapsed() > Duration::from_secs(3)) {
                      interfaces = networks();
                      refreshed = Some(Instant::now());
                  }
                  if other_lan_pc(&interfaces, *source.ip()) {
                      last_reply = Some(Instant::now());
                      let _ = socket.send_to(&named_packet(nonce, hostname), source);
                  }
              }
          }

          pub fn scan(networks: &[Network], nonce: [u8; 16]) -> BTreeMap<Ipv4Addr, String> {
              let mut query = QUERY.to_vec();
              query.extend_from_slice(&nonce);
              let mut sockets = Vec::new();
              for net in networks.iter().copied().collect::<BTreeSet<_>>().into_iter().take(32) {
                  let Ok(socket) = UdpSocket::bind((net.local, 0)) else { continue };
                  if socket.set_broadcast(true).is_err() || socket.set_nonblocking(true).is_err() {
                      continue;
                  }
                  let target = SocketAddrV4::new(net.broadcast(), DISCOVERY_PORT);
                  if socket.send_to(&query, target).is_ok() {
                      sockets.push((net, socket));
                  }
              }
              let until = Instant::now() + SCAN_TIME;
              let mut peers = BTreeMap::new();
              let mut buf = [0u8; 256];
              while !sockets.is_empty() && Instant::now() < until && peers.len() < MAX_PEERS {
                  for (net, socket) in &sockets {
                      for _ in 0..8 {
                          match socket.recv_from(&mut buf) {
                              Ok((size, SocketAddr::V4(source))) => {
                                  let ip = *source.ip();
                                  if source.port() == DISCOVERY_PORT && net.admits(ip) && other_lan_pc(networks, ip) {
                                      if let Some(name) = extract_name(&buf[..size], &nonce) {
                                          peers.entry(ip).or_insert(name);
                                          if peers.len() >= MAX_PEERS { return peers; }
                                      }
                                  }
                              }
                              Ok(_) => {}
                              Err(e) if e.kind() == ErrorKind::WouldBlock => break,
                              Err(_) => break,
                          }
                      }
                  }
                  thread::sleep(Duration::from_millis(12));
              }
              peers
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn same_subnet_and_no_self_or_broadcast() {
                  let net = Network::new("192.168.5.20".parse().unwrap(), "255.255.254.0".parse().unwrap()).unwrap();
                  let own = Network::new("192.168.4.30".parse().unwrap(), "255.255.254.0".parse().unwrap()).unwrap();
                  let all = [net, own];
                  assert_eq!(net.broadcast(), "192.168.5.255".parse::<Ipv4Addr>().unwrap());
                  for allowed in ["192.168.5.21", "192.168.4.21"] {
                      assert!(other_lan_pc(&all, allowed.parse().unwrap()));
                  }
                  for rejected in ["192.168.5.20", "192.168.4.30", "192.168.4.0", "192.168.5.255", "192.168.6.20", "8.8.8.8"] {
                      assert!(!other_lan_pc(&all, rejected.parse().unwrap()));
                  }
                  assert!(Network::new("192.168.5.20".parse().unwrap(), "255.0.255.0".parse().unwrap()).is_none());
                  assert!(Network::new("8.8.8.8".parse().unwrap(), "255.255.255.0".parse().unwrap()).is_none());
              }

              #[test]
              fn response_must_echo_nonce_and_have_a_valid_bounded_name() {
                  let nonce = [1; 16];
                  assert_eq!(extract_name(&named_packet(&nonce, "AIDA-PC"), &nonce).as_deref(), Some("AIDA-PC"));
                  assert!(extract_name(&named_packet(&nonce, "AIDA-PC"), &[2; 16]).is_none());
                  assert!(extract_name(&named_packet(&nonce, "AIDA\nPC"), &nonce).is_none());
                  assert!(extract_name(&named_packet(&nonce, "AIDA\u{202e}PC"), &nonce).is_none());
                  assert!(extract_name(b"unrelated", &nonce).is_none());
                  assert!(extract_name(&named_packet(&nonce, &"Ž".repeat(100)), &nonce).unwrap().len() <= NAME_MAX);
              }
          }
          DACHKLINIK_DISCOVERY_RS

      - name: Check and stage LAN source against the pinned RustDesk revision
        shell: bash
        run: |
          python3 - <<'PY_DACHKLINIK_LAN'
          # DACHKLINIK REMOTE V1.2 LAN pilot. Run on the pinned checkout before build.
          import re
          from pathlib import Path

          changes = {}

          def read(rel):
              if rel not in changes:
                  changes[rel] = Path(rel).read_text(encoding='utf-8')
              return changes[rel]

          def edit(rel, pattern, replacement):
              source = read(rel)
              matches = list(re.finditer(pattern, source, re.M))
              if len(matches) != 1:
                  raise SystemExit(f'LAN patch stopped: {rel}, expected 1 anchor, got {len(matches)}: {pattern}')
              m = matches[0]
              sub = replacement(m) if callable(replacement) else replacement
              changes[rel] = source[:m.start()] + sub + source[m.end():]

          def after(rel, anchor, body):
              edit(rel, anchor, lambda m: m[0] + body)

          mediator = 'src/rendezvous_mediator.rs'
          client = 'src/client.rs'
          common = 'src/common.rs'
          connection = 'src/server/connection.rs'
          ui = 'src/ui_interface.rs'
          cfg = 'libs/hbb_common/src/config.rs'

          # Distinct configuration and local IPC namespace from a stock RustDesk process.
          edit(cfg, r'(pub static ref APP_NAME: RwLock<String> = RwLock::new\()"RustDesk"(\.to_owned\(\)\);)',
               lambda m: m[1] + '"DachklinikRemoteV12"' + m[2])

          # Reuse upstream listener, approved session code and Windows portable startup.
          after(mediator, r'    pub async fn start_all\(\) \{', '''
                  if cfg!(windows) {
                      check_zombie();
                      let server = new_server();
                      if !config::is_outgoing_only() {
                          let direct = server.clone();
                          tokio::spawn(async move { direct_server(direct).await });
                          std::thread::spawn(crate::lan::dachklinik_listen);
                      }
                      scrap::codec::test_av1();
                      loop {
                          if config::option2bool("stop-service", &Config::get_option("stop-service")) {
                              server.write().unwrap().close_connections();
                          }
                          sleep(1.).await;
                      }
                  }
          '''.rstrip())
          after(mediator, r'if let Ok\(Ok\(\(stream, addr\)\)\) = hbb_common::timeout\(1000, l\.accept\(\)\)\.await \{',
                '''
                          if cfg!(windows) {
                              let source = hbb_common::try_into_v4(addr);
                              if !matches!(source.ip(), std::net::IpAddr::V4(ip)
                                  if crate::lan::dachklinik_v12::other_lan_pc(&crate::lan::dachklinik_networks(), ip))
                                  || config::option2bool("stop-service", &Config::get_option("stop-service"))
                              {
                                  continue;
                              }
                          }
          '''.rstrip())
          edit(mediator, r'(?m)^fn get_direct_port\(\) -> i32 \{', '''
          fn get_direct_port() -> i32 {
              if cfg!(windows) {
                  return crate::lan::dachklinik_v12::SESSION_PORT.into();
              }'''.lstrip())

          # Fail before ID lookup, relay, WebSocket, proxy or DNS. The direct socket
          # deliberately bypasses connect_tcp_local, which may honor a configured SOCKS proxy.
          edit(client, r'(?m)^        if hbb_common::is_ip_str\(peer\) \{(?=\n[\s\S]{0,160}connect_tcp_local\(check_port\(peer, RELAY_PORT \+ 1\))',
               '        if cfg!(windows) || hbb_common::is_ip_str(peer) {')
          edit(client, r'connect_tcp_local\(check_port\(peer, RELAY_PORT \+ 1\), None, CONNECT_TIMEOUT\)\s*\.await\?,', '''
                              if cfg!(windows) {
                                  if !matches!(conn_type, ConnType::DEFAULT_CONN | ConnType::FILE_TRANSFER) {
                                      bail!("DACHKLINIK LAN: use Remote Desktop or File Transfer.");
                                  }
                                  let Some(ip) = peer.trim().parse::<std::net::Ipv4Addr>().ok()
                                      .filter(|ip| crate::lan::dachklinik_v12::other_lan_pc(&crate::lan::dachklinik_networks(), *ip))
                                  else {
                                      bail!("DACHKLINIK LAN V1.2: Ziel muss im selben lokalen Netzwerk sein.");
                                  };
                                  let endpoint = std::net::SocketAddr::from((ip, crate::lan::dachklinik_v12::SESSION_PORT));
                                  let socket = timeout(
                                      CONNECT_TIMEOUT,
                                      hbb_common::tokio::net::TcpStream::connect(endpoint),
                                  ).await??;
                                  socket.set_nodelay(true).ok();
                                  let local = socket.local_addr()?;
                                  hbb_common::Stream::from(socket, local)
                              } else {
                                  connect_tcp_local(check_port(peer, RELAY_PORT + 1), None, CONNECT_TIMEOUT)
                                      .await?
                              },
          '''.strip())

          # Keep the built-in approval UI and permission checks. No login-screen exception.
          # Only remote desktop and file transfer are in scope for this pilot.
          after(connection, r'(?m)^    async fn on_message\(&mut self, msg: Message\) -> bool \{', '''
                  if cfg!(windows)
                      && matches!(msg.union.as_ref(), Some(message::Union::SwitchSidesResponse(_)))
                  {
                      return false;
                  }
          '''.rstrip())
          after(connection, r'(?m)^        if let Some\(message::Union::LoginRequest\(lr\)\) = msg\.union \{', '''
                      if cfg!(windows) {
                          if !matches!(lr.union.as_ref(), None | Some(login_request::Union::FileTransfer(_))) {
                              self.send_login_error("DACHKLINIK LAN: connection type not supported").await;
                              return false;
                          }
                          if !lr.password.is_empty() || !lr.os_login.username.is_empty() || !lr.os_login.password.is_empty() {
                              self.send_login_error("DACHKLINIK LAN V1.2.1: only local click approval is supported").await;
                              return false;
                          }
                      }
          '''.rstrip())
          edit(connection, r'if \(password::approve_mode\(\) == ApproveMode::Click\s*&& !allow_logon_screen_password\)',
               lambda m: 'if cfg!(windows) || (password::approve_mode() == ApproveMode::Click && !allow_logon_screen_password)')

          # Apply fixed settings to both the native runner and Flutter-loaded Rust library.
          # The standard local "stop-service" and file/desktop permission choices remain available.
          policy = '''
                  config::OVERWRITE_SETTINGS.write().unwrap().extend(
                      [
                          ("direct-server", "Y"),
                          ("direct-access-port", "21138"),
                          ("approve-mode", "click"),
                          ("allow-hide-cm", "N"),
                          ("enable-tunnel", "N"),
                          ("enable-terminal", "N"),
                          ("enable-camera", "N"),
                      ].into_iter().map(|(k, v)| (k.to_owned(), v.to_owned())),
                  );
                  config::OVERWRITE_LOCAL_SETTINGS.write().unwrap().insert(
                      "enable-check-update".to_owned(), "N".to_owned(),
                  );
                  config::BUILTIN_SETTINGS.write().unwrap().extend(
                      [
                          ("allow-logon-screen-password", "N"),
                          ("allow-remote-cm-modification", "N"),
                          ("disable-installation", "Y"),
                          ("disable-account", "Y"),
                          ("disable-ab", "Y"),
                          ("hide-network-settings", "Y"),
                          ("register-device", "N"),
                      ].into_iter().map(|(k, v)| (k.to_owned(), v.to_owned())),
                  );
          '''
          after(common, r'(?m)^pub fn load_custom_client\(\) \{',
                '\n    if cfg!(windows) {' + policy + '        return;\n    }')
          after(common, r'(?m)^pub fn read_custom_client\(config: &str\) \{',
                '\n    if cfg!(windows) {\n        load_custom_client();\n        return;\n    }')
          for name in ('test_nat_type', 'test_rendezvous_server', 'check_software_update'):
              after(common, rf'(?m)^pub fn {name}\(\) \{{',
                    '\n    if cfg!(windows) {\n        return;\n    }')
          after(common, r'(?m)^pub fn get_api_server\(api: String, custom: String\) -> String \{',
                '\n    if cfg!(windows) {\n        return String::new();\n    }')
          after(common, r'(?m)^pub async fn do_check_software_update\(\) -> (?:hbb_common::)?ResultType<\(\)> \{',
                '\n    if cfg!(windows) {\n        return Ok(());\n    }')
          for name in ('post_request_sync', 'http_request_sync'):
              after(common, rf'(?m)^pub async fn {name}\([^{{}}]*?\) -> ResultType<String> \{{',
                    '\n    if cfg!(windows) {\n        bail!("DACHKLINIK LAN: HTTP service disabled");\n    }')
          after(ui, r'(?m)^pub fn test_if_valid_server\(host: String, test_with_proxy: bool\) -> String \{',
                '\n    if cfg!(windows) {\n        return "DACHKLINIK LAN: server settings are disabled".to_owned();\n    }')

          after(ui, r'(?m)^pub fn resolve_avatar_url\(avatar: String\) -> String \{',
                '\n    if cfg!(windows) {\n        return String::new();\n    }')
          updater = 'src/updater.rs'
          after(updater, r'(?m)^pub fn manually_check_update\(\) -> ResultType<\(\)> \{',
                '\n    if cfg!(windows) {\n        return Ok(());\n    }')

          # V1.2: distinguish this pilot from previously extracted copies and stock clients.
          lan = 'src/lan.rs'
          after(lan, r'^type Message = RendezvousMessage;', '''
          #[path = "dachklinik_discovery.rs"]
          pub(crate) mod dachklinik_v12;

          pub(crate) fn dachklinik_networks() -> Vec<dachklinik_v12::Network> {
              let mut networks = Vec::new();
              #[cfg(not(target_os = "ios"))]
              for interface in default_net::get_interfaces() {
                  for ip in interface.ipv4 {
                      if let Some(net) = dachklinik_v12::Network::new(ip.addr, ip.netmask) {
                          networks.push(net);
                      }
                  }
              }
              networks
          }

          pub(crate) fn dachklinik_listen() {
              #[cfg(windows)]
              {
                  let hostname = whoami::hostname();
                  let hostname = if hostname.trim().is_empty() { "Windows-PC" } else { &hostname };
                  if let Err(err) = dachklinik_v12::listen(hostname, dachklinik_networks, || {
                      config::option2bool("stop-service", &Config::get_option("stop-service"))
                  }) {
                      log::error!("DACHKLINIK LAN discovery: {err}");
                  }
              }
          }
          '''.rstrip())

          # A discovery reply can be sent only while the real TCP listener is available.
          # The same-subnet checks also apply to direct TCP and do not grant authorization.
          edit(mediator, r'(?m)^(?P<i>\s*)listener = Some\(l\);', lambda m:
               m[0] + '\n' + m['i'] + 'if cfg!(windows) { crate::lan::dachklinik_v12::set_accepting(true); }')
          edit(mediator, r'(?m)^(?P<i>\s*)listener = None;(?=\s*continue;)', lambda m:
               m[0] + '\n' + m['i'] + 'if cfg!(windows) { crate::lan::dachklinik_v12::set_accepting(false); }')

          # The pinned 1.5.3 build includes upstream RequestApproval. Force the existing
          # method for Windows sessions, including those opened outside the LAN panel.
          after(client, r'^([ \t]*)self\.login_method\s*=\s*Default::default\(\);(?=\s*if !login_method\.is_empty\(\)\s*&&\s*!self\.set_login_method\(login_method\))',
                '\n        let login_method = if cfg!(windows) { "request-approval" } else { login_method };')

          # A peer that unexpectedly requests a password is incompatible with this
          # pilot. Report the error and stop. Keep the native click-approval wait message.
          edit(client, r'(?m)^    if err == LOGIN_MSG_PASSWORD_EMPTY \{', """
              if cfg!(windows) && (err == LOGIN_MSG_PASSWORD_EMPTY || err == LOGIN_MSG_PASSWORD_WRONG) {
                  interface.msgbox(
                      "error",
                      "Login Error",
                      "DACHKLINIK LAN: Bitte auf beiden PCs dieselbe Version öffnen.",
                      "",
                  );
                  return false;
              }
              if err == LOGIN_MSG_PASSWORD_EMPTY {""".lstrip('\n'))

          # Use the short German label for the upstream approval status, including File Transfer.
          edit('src/lang/de.rs',
               r'(\("Please wait for the remote side to accept your session request\.\.\.",\s*)"[^"\n]*"(\))',
               lambda m: m[1] + '"Warte auf Bestätigung"' + m[2])


          after(ui, r"^pub fn get_lan_peers\(\) -> Vec<HashMap<&'static str, String>> \{", '''
              #[cfg(windows)]
              {
                  use crate::lan::{dachklinik_networks, dachklinik_v12};
                  static SCAN_LOCK: std::sync::Mutex<()> = std::sync::Mutex::new(());
                  let Ok(_scan) = SCAN_LOCK.lock() else { return Vec::new() };
                  let nonce = *uuid::Uuid::new_v4().as_bytes();
                  return dachklinik_v12::scan(&dachklinik_networks(), nonce)
                      .into_iter()
                      .map(|(ip, name)| {
                          HashMap::from([
                              ("id", ip.to_string()),
                              ("username", String::new()),
                              ("hostname", name),
                              ("platform", "Windows".to_owned()),
                          ])
                      })
                      .collect();
              }
          '''.rstrip())

          path = 'src/dachklinik_discovery.rs'
          if Path(path).exists():
              raise SystemExit(f'Unexpected existing LAN module: {path}')
          changes[path] = Path('_DACHKLINIK_DISCOVERY_INPUT.rs').read_text(encoding='utf-8')

          # Every transformation must match before any file is written.
          for rel, body in changes.items():
              Path(rel).write_text(body, encoding='utf-8', newline='\n')
              print('LAN patch:', rel)
          Path('_DACHKLINIK_LAN_SOURCE_LIST.txt').write_text('\n'.join(sorted(changes)) + '\n', encoding='utf-8')
          PY_DACHKLINIK_LAN
          while IFS= read -r file; do
            mkdir -p "_DACHKLINIK_LAN_SOURCES/$(dirname "$file")"
            cp "$file" "_DACHKLINIK_LAN_SOURCES/$file"
          done < _DACHKLINIK_LAN_SOURCE_LIST.txt
          git rev-parse HEAD > _DACHKLINIK_LAN_SOURCE_REVISION.txt
          git -C libs/hbb_common rev-parse HEAD >> _DACHKLINIK_LAN_SOURCE_REVISION.txt
          while IFS= read -r file; do
            if [[ "$file" == src/dachklinik_discovery.rs ]]; then
              rm -- "$file"
            elif [[ "$file" == libs/hbb_common/* ]]; then
              git -C libs/hbb_common restore -- "${file#libs/hbb_common/}"
            else
              git restore -- "$file"
            fi
          done < _DACHKLINIK_LAN_SOURCE_LIST.txt
          git diff --exit-code HEAD -- .
          git -C libs/hbb_common diff --exit-code HEAD -- .
          grep -Fq 'State<ConnectionPage> createState() => _ConnectionPageState();' flutter/lib/desktop/pages/connection_page.dart
          grep -Fq 'buildIDBoard(context)' flutter/lib/desktop/pages/desktop_home_page.dart
          grep -Fq 'pub fn main_get_lan_peers() -> String' src/flutter_ffi.rs
          grep -Fq 'LoginMethod::RequestApproval' src/client/login_method.rs
          grep -Eq 'String[[:space:]]+loginMethod[[:space:]]*=' flutter/lib/common.dart

      - name: Install bridge prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.75'
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Test LAN packet validation and local subnet rules
        shell: bash
        run: |
          rustc --edition 2021 --test _DACHKLINIK_LAN_SOURCES/src/dachklinik_discovery.rs -o "$RUNNER_TEMP/dachklinik-lan-tests"
          "$RUNNER_TEMP/dachklinik-lan-tests"
          while IFS= read -r file; do
            rustfmt --emit stdout --config skip_children=true --edition 2021 "_DACHKLINIK_LAN_SOURCES/$file" > /dev/null
          done < _DACHKLINIK_LAN_SOURCE_LIST.txt

      - name: Install Flutter for bridge codegen
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.22.3'
          cache: true

      - name: Install bridge generators and resolve Dart dependencies
        shell: bash
        run: |
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION" --features uuid --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)

      - name: Generate bridge
        shell: bash
        run: |
          "$HOME/.cargo/bin/flutter_rust_bridge_codegen" --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge for the Windows job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dachklinik-v121-bridge
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
            ./_DACHKLINIK_LAN_SOURCE_LIST.txt
            ./_DACHKLINIK_LAN_SOURCE_REVISION.txt
            ./_DACHKLINIK_LAN_SOURCES/
          if-no-files-found: error
          retention-days: 7

  topmost:
    name: Build Windows helper DLL (x64 only)
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  windows-x64:
    name: DACHKLINIK LAN V1.2.1 Windows x64 (unsigned pilot)
    needs: [bridge, topmost]
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      FLUTTER_VERSION: '3.24.5'
      LLVM_VERSION: '15.0.6'
      VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - name: Initialize GitHub Actions cache environment
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check out DACHKLINIK DESIGN V1.0 with submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: dachklinik-v1.5.3
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false

      - name: Verify DACHKLINIK design revision
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          if (-not $revision.StartsWith('9a24afc')) { throw "Wrong design revision: $revision" }
          $base = (git rev-parse 'HEAD^').Trim()
          if ($base -ne '95cca3f661f635b3cc85c04935fe8d96d8f432ef') { throw 'Unexpected base commit' }
          $changed = @(git diff --name-only 'HEAD^' HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'flutter/lib/desktop/pages/desktop_home_page.dart') { throw 'Unexpected modified file(s)' }
          $source = Get-Content -LiteralPath './flutter/lib/desktop/pages/desktop_home_page.dart' -Raw -Encoding UTF8
          if (-not $source.Contains("'DACHKLINIK REMOTE'")) { throw 'DACHKLINIK design marker missing' }

      - name: Download generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dachklinik-v121-bridge
          path: ./

      - name: Apply verified LAN sources to the Windows checkout
        shell: bash
        run: |
          {
            git rev-parse HEAD
            git -C libs/hbb_common rev-parse HEAD
          } > _DACHKLINIK_LAN_WINDOWS_REVISION.txt
          diff -u _DACHKLINIK_LAN_SOURCE_REVISION.txt _DACHKLINIK_LAN_WINDOWS_REVISION.txt
          while IFS= read -r file; do
            if [[ "$file" == src/dachklinik_discovery.rs ]]; then
              test ! -e "$file"
            else
              test -f "$file"
            fi
            cp "_DACHKLINIK_LAN_SOURCES/$file" "$file"
          done < _DACHKLINIK_LAN_SOURCE_LIST.txt
          test -s _DACHKLINIK_LAN_SOURCE_LIST.txt

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: '15.0.6'

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: '3.24.5'
          architecture: x64

      - name: Install RustDesk custom Flutter Windows engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri 'https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip' -OutFile 'windows-x64-release.zip'
          Expand-Archive -Path 'windows-x64-release.zip' -DestinationPath 'windows-x64-release'
          Move-Item -Force -Path 'windows-x64-release/*' -Destination 'C:/hostedtoolcache/windows/flutter/stable-3.24.5-x64/bin/cache/artifacts/engine/windows-x64-release/'

      - name: Apply upstream Flutter dropdown compatibility patch
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust 1.75 toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.75'
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Set up vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: false

      - name: Install native dependencies for x64
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name '*.log' -print | head -n 30
            exit 1
          fi

      - name: Stage the LAN list interface
        shell: bash
        run: |
          cat > _DACHKLINIK_PANEL_INPUT.dart <<'DACHKLINIK_PANEL_DART'
          // DACHKLINIK REMOTE V1.2 - local discovery panel.
          class DachklinikLocalBoard extends StatelessWidget {
            const DachklinikLocalBoard({super.key, required this.settings});

            final Widget settings;

            @override
            Widget build(BuildContext context) {
              String hostname = 'Dieser PC';
              try {
                final name = dk_io.Platform.localHostname.trim();
                if (name.isNotEmpty) hostname = name;
              } catch (_) {}
              return Padding(
                padding: const EdgeInsets.fromLTRB(14, 4, 12, 12),
                child: Row(
                  children: [
                    const Icon(Icons.computer_outlined, size: 20),
                    const SizedBox(width: 8),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(hostname, maxLines: 1, overflow: TextOverflow.ellipsis),
                          Text('LAN · V1.2.1', style: Theme.of(context).textTheme.bodySmall),
                        ],
                      ),
                    ),
                    settings,
                  ],
                ),
              );
            }
          }

          class _DachklinikLanState extends State<ConnectionPage> {
            Timer? _timer;
            bool _busy = false;
            bool _loaded = false;
            bool _unavailable = false;
            Map<String, String> _peers = const {};

            @override
            void initState() {
              super.initState();
              _timer = Timer.periodic(const Duration(seconds: 5), (_) => _refresh());
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (mounted) _refresh();
              });
            }

            @override
            void dispose() {
              _timer?.cancel();
              super.dispose();
            }

            Future<void> _refresh() async {
              if (!mounted || _busy) return;
              _busy = true;
              if (!_loaded) setState(() {});
              Map<String, String> found = {};
              bool failed = false;
              try {
                final response = jsonDecode(await bind.mainGetLanPeers());
                if (response is! List) throw const FormatException('LAN');
                for (final peer in response) {
                  if (peer is! Map) continue;
                  final ip = peer['id'];
                  final name = peer['hostname'];
                  if (ip is! String || name is! String || name.isEmpty) continue;
                  final address = dk_io.InternetAddress.tryParse(ip);
                  if (address == null || address.type != dk_io.InternetAddressType.IPv4) continue;
                  found[address.address] = name;
                }
              } catch (_) {
                failed = true;
              } finally {
                _busy = false;
              }
              if (!mounted) return;
              if (!_loaded || failed != _unavailable || !dk_foundation.mapEquals(found, _peers)) {
                setState(() {
                  _loaded = true;
                  _unavailable = failed;
                  _peers = found;
                });
              }
            }

            void _open(String ip, {bool files = false}) {
              if (!_peers.containsKey(ip)) return;
              connect(context, ip, isFileTransfer: files, loginMethod: 'request-approval');
            }

            @override
            Widget build(BuildContext context) {
              final peers = _peers.entries.toList()
                ..sort((a, b) {
                  final byName = a.value.toLowerCase().compareTo(b.value.toLowerCase());
                  return byName == 0 ? a.key.compareTo(b.key) : byName;
                });
              final names = <String, int>{};
              for (final peer in peers) {
                names.update(peer.value.toLowerCase(), (n) => n + 1, ifAbsent: () => 1);
              }
              final status = !_loaded
                  ? 'Suche nach Rechnern …'
                  : _unavailable
                      ? 'Netzwerksuche fehlgeschlagen. Bitte aktualisieren.'
                      : 'Noch kein Rechner gefunden. Öffne DACHKLINIK REMOTE V1.2.1 auf dem anderen PC im selben Netzwerk.';
              return Padding(
                padding: const EdgeInsets.fromLTRB(16, 20, 16, 12),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Row(
                      children: [
                        Expanded(
                          child: Text('Rechner im lokalen Netzwerk',
                              style: Theme.of(context).textTheme.titleLarge),
                        ),
                        IconButton(
                          onPressed: _refresh,
                          tooltip: 'Aktualisieren',
                          icon: const Icon(Icons.refresh),
                        ),
                      ],
                    ),
                    const SizedBox(height: 4),
                    const Text('Eine Verbindung startet erst nach Bestätigung am anderen PC.'),
                    const SizedBox(height: 12),
                    if (peers.isEmpty)
                      Expanded(child: Align(alignment: Alignment.topLeft, child: Text(status)))
                    else
                      Expanded(
                        child: ListView.builder(
                          itemCount: peers.length,
                          itemBuilder: (_, index) {
                            final peer = peers[index];
                            final duplicate = (names[peer.value.toLowerCase()] ?? 0) > 1;
                            return Card(
                              key: ValueKey(peer.key),
                              color: const Color(0xFF8EA4BD).withOpacity(0.22),
                              elevation: 0,
                              child: Padding(
                                padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                                child: Row(
                                  children: [
                                    const Icon(Icons.desktop_windows_outlined),
                                    const SizedBox(width: 10),
                                    Expanded(
                                      child: Text(duplicate ? '${peer.value} (${peer.key})' : peer.value,
                                          maxLines: 1, overflow: TextOverflow.ellipsis),
                                    ),
                                    FilledButton(
                                      onPressed: () => _open(peer.key),
                                      child: const Text('Verbinden'),
                                    ),
                                    IconButton(
                                      tooltip: 'Dateien übertragen',
                                      onPressed: () => _open(peer.key, files: true),
                                      icon: const Icon(Icons.folder_copy_outlined),
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        ),
                      ),
                  ],
                ),
              );
            }
          }
          DACHKLINIK_PANEL_DART

      - name: Stage existing icon (1/4)
        shell: bash
        run: |
          printf '%s' '' > _DACHKLINIK_ICON.b64

      - name: Stage existing icon (2/4)
        shell: bash
        run: |
          printf '%s' '' >> _DACHKLINIK_ICON.b64

      - name: Stage existing icon (3/4)
        shell: bash
        run: |
          printf '%s' '' >> _DACHKLINIK_ICON.b64

      - name: Stage existing icon (4/4)
        shell: bash
        run: |
          printf '%s' '' >> _DACHKLINIK_ICON.b64

      - name: Apply DACHKLINIK V1.2.1 layout and branding
        shell: bash
        run: |
          python3 - <<'PY_DACHKLINIK_V102'
          from pathlib import Path
          import base64, hashlib, shutil
          
          root = Path('.')
          changed = Path("_DACHKLINIK_LAN_SOURCE_LIST.txt").read_text(encoding="utf-8").splitlines()
          def edit(rel, old, new):
              p = root / rel
              s = p.read_text(encoding='utf-8-sig')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'SAFE STOP: {rel}: expected exactly one matching original text, found {n}')
              updated = s.replace(old,new,1)
              p.write_text(updated,encoding='utf-8',newline='\n')
              changed.append(rel)
          
          home = 'flutter/lib/desktop/pages/desktop_home_page.dart'
          old_title = "      const Padding(\n        padding: EdgeInsets.fromLTRB(20, 16, 16, 14),\n        child: Align(\n          alignment: Alignment.centerLeft,\n          child: Text(\n            'DACHKLINIK REMOTE',\n            style: TextStyle(\n              fontSize: 18,\n              fontWeight: FontWeight.w600,\n            ),\n          ),\n        ),\n      ),"
          new_title = "      const Padding(\n        padding: EdgeInsets.fromLTRB(12, 16, 8, 10),\n        child: Align(\n          alignment: Alignment.centerLeft,\n          child: Text(\n            'DACHKLINIK REMOTE',\n            maxLines: 1,\n            softWrap: false,\n            overflow: TextOverflow.ellipsis,\n            style: TextStyle(\n              fontSize: 16,\n              fontWeight: FontWeight.w700,\n            ),\n          ),\n        ),\n      ),"
          edit(home,old_title,new_title)
          edit(home, 'buildIDBoard(context)', 'DachklinikLocalBoard(settings: buildPopupMenu(context))')
          edit(home,'width: isIncomingOnly ? 280.0 : 200.0,','width: isIncomingOnly ? 280.0 : 234.0,')
          
          tab='flutter/lib/desktop/pages/desktop_tab_page.dart'
          edit(tab,
              '            body: DesktopTab(\n              controller: tabController,',
              '            body: DesktopTab(\n              controller: tabController,\n              showLogo: false,')
          
          peer='flutter/lib/common/widgets/peer_card.dart'
          edit(peer,
              "            decoration: BoxDecoration(\n              color: str2color('${peer.id}${peer.platform}', 0x7f),\n              borderRadius: isPortrait",
              "            decoration: BoxDecoration(\n              color: const Color(0xFF8EA4BD),\n              borderRadius: isPortrait")
          edit(peer,
              "                  child: Container(\n                    color: str2color('${peer.id}${peer.platform}', 0x7f),\n                    child: Row(",
              "                  child: Container(\n                    color: const Color(0xFF8EA4BD),\n                    child: Row(")
          
          conn='flutter/lib/desktop/pages/connection_page.dart'
          edit(conn,
               'State<ConnectionPage> createState() => _ConnectionPageState();',
               'State<ConnectionPage> createState() =>\n'
               '      isWindows ? _DachklinikLanState() : _ConnectionPageState();')
          panel_path = root / conn
          panel_original = panel_path.read_text(encoding='utf-8')
          panel_imports = (
              "import 'dart:io' as dk_io;\n"
              "import 'package:flutter/foundation.dart' as dk_foundation;\n"
          )
          panel_body = Path('_DACHKLINIK_PANEL_INPUT.dart').read_text(encoding='utf-8')
          panel_path.write_text(panel_imports + panel_original + '\n' + panel_body,
                                encoding='utf-8', newline='\n')

          cmake='flutter/windows/CMakeLists.txt'
          edit(cmake,'set(BINARY_NAME "rustdesk")','set(BINARY_NAME "DACHKLINIK_REMOTE")')
          
          rc='flutter/windows/runner/Runner.rc'
          for a,b in [
              ('VALUE "FileDescription", "RustDesk Remote Desktop"', 'VALUE "FileDescription", "DACHKLINIK REMOTE (RustDesk based)"'),
              ('VALUE "InternalName", "rustdesk"','VALUE "InternalName", "DACHKLINIK_REMOTE"'),
              ('VALUE "OriginalFilename", "rustdesk.exe"','VALUE "OriginalFilename", "DACHKLINIK_REMOTE.exe"'),
              ('VALUE "ProductName", "RustDesk"','VALUE "ProductName", "DACHKLINIK REMOTE"'),
          ]:
              edit(rc,a,b)
          # Preserve upstream legal copyright and AGPL notice in the resource.
          
          main='flutter/windows/runner/main.cpp'
          edit(main,'  // Uri links dispatch','  // DACHKLINIK native window name.\n  app_name = L"DachklinikRemoteV12";\n  // Uri links dispatch')
          
          # Put exactly the same, deterministic icon in compiled exe AND Flutter window assets.
          icon_data = base64.b64decode(Path('_DACHKLINIK_ICON.b64').read_bytes(), validate=True)
          assert icon_data[:4] == b'\x00\x00\x01\x00'
          for rel in ['flutter/windows/runner/resources/app_icon.ico','flutter/assets/icon.ico']:
              p=root/rel
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(icon_data)
              changed.append(rel)
          
          # Full changed files for the user, not just diff excerpts.  Source is also archived
          # with runtime separately to honour the AGPL and allow audit.
          manifest=[]
          for rel in dict.fromkeys(changed):
              path=root/rel
              dst = Path('_DACHKLINIK_SOURCE_PATCH')/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(path,dst)
              manifest.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}')
          (Path('_DACHKLINIK_SOURCE_PATCH')/'SHA256.txt').write_text('\n'.join(manifest)+'\n',encoding='utf-8')
          shutil.copy2('_DACHKLINIK_LAN_SOURCE_REVISION.txt', '_DACHKLINIK_SOURCE_PATCH/SOURCE_REVISIONS.txt')
          (Path('_DACHKLINIK_SOURCE_PATCH')/'README.txt').write_text(
            'DACHKLINIK REMOTE V1.2.1 LAN PILOT - COMPLETE MODIFIED FILES ONLY\n'
            'From RustDesk 1.5.3 with existing DACHKLINIK DESIGN V1.0 patch.\n'
            'UI-only footer and heading changes, top bar logo removal, neutral peer card color; native Windows binary name, icon, metadata.\n'
            'Local broadcast discovery, same-subnet private IPv4, local click approval, no password or ID/relay fallback. Direct IP is unencrypted.\n'
            'For app source and AGPL license, see mico2012/DACHKLINIK-REMOTE and upstream rustdesk/rustdesk.\n',
            encoding='utf-8')
          print('DACHKLINIK patch applied, source files:',len(manifest))
          PY_DACHKLINIK_V102

      - name: Build RustDesk Flutter x64 (portable folder, not installer)
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw "RustDesk build failed: $LASTEXITCODE" }
          $release = 'flutter/build/windows/x64/runner/Release'
          if (-not (Test-Path -LiteralPath "$release/DACHKLINIK_REMOTE.exe")) { throw "Missing: $release/DACHKLINIK_REMOTE.exe" }
          Move-Item -LiteralPath $release -Destination 'dachklinik_remote'

      - name: Include RustDesk Windows helper DLL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: ./dachklinik_remote

      - name: Check Windows outputs and write pilot notes
        shell: pwsh
        run: |
          if (-not (Test-Path './dachklinik_remote/DACHKLINIK_REMOTE.exe')) { throw 'DACHKLINIK_REMOTE.exe not found' }
          if (-not (Test-Path './dachklinik_remote/flutter_windows.dll')) { throw 'Flutter Windows runtime not found' }
          if (-not (Test-Path './dachklinik_remote/librustdesk.dll')) { throw 'RustDesk library not found' }
          $core = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path './dachklinik_remote/librustdesk.dll').Path))
          if (-not $core.Contains('DACHKLINIK LAN V1.2.1: only local click approval is supported')) { throw 'The compiled library is not the V1.2 LAN core' }
          Remove-Variable core
          (Get-FileHash './dachklinik_remote/DACHKLINIK_REMOTE.exe' -Algorithm SHA256).Hash | Set-Content './dachklinik_remote/EXE_SHA256.txt'
          Copy-Item -LiteralPath './LICENCE' -Destination './dachklinik_remote/LICENCE'
          @'
          DACHKLINIK REMOTE V1.2.1 AUTOMATIC LAN AND CLICK APPROVAL - WINDOWS X64 PILOT
          Keep DACHKLINIK_REMOTE.exe, all DLLs, and the data folder together.
          Quit older Dachklinik or RustDesk copies on both PCs before the test.
          Run V1.2.1 on both authorized Windows PCs on the same private IPv4 test subnet.
